<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playhaus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Rubik:wght@500;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: sticky top bar, hero with game of the day + quick picks, category chips, responsive card grid, modal player. Committed dark arcade look. */
:root{
  --bg:#0d1022; --surface:#161a33; --surface-2:#1f2445; --line:#2d3360;
  --fg:#eef0fb; --muted:#9ba1c9; --accent:#7b61ff; --accent-ink:#ffffff;
  --hot:#ff5c8a; --gold:#ffc83d; --ok:#3ddc97; --stage:#0a0c1c;
  --font-display:'Rubik',system-ui,sans-serif; --font-body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 40px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--font-display);letter-spacing:-.02em}
.brand svg{width:30px;height:30px;flex:none}
.search{flex:1 1 220px;min-width:0;position:relative;max-width:520px;margin-left:auto}
.search input{
  width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--fg);padding:0 16px 0 42px;font:inherit
}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px;margin-top:22px}
.feature{position:relative;border-radius:20px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.feature .art{aspect-ratio:16/8;border-radius:0}
.feature-body{padding:18px 20px 20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.feature-body>div{min-width:0;flex:1 1 260px}
.eyebrow{font:700 12px/1 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.feature h1{margin:6px 0 4px;font:800 clamp(26px,4vw,38px)/1.05 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.feature p{margin:0;color:var(--muted);max-width:60ch}
.btn{
  display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);font:700 15px/1 var(--font-display);
}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.small{height:36px;padding:0 14px;font-size:13px}
.btn svg{width:16px;height:16px}
.picks{display:flex;flex-direction:column;gap:10px;min-width:0}
.picks h2{margin:0 0 2px;font:700 13px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--surface);min-width:0}
.pick:hover{background:var(--surface-2)}
.pick .art{width:84px;flex:none;aspect-ratio:4/3;border-radius:10px}
.pick strong{display:block;font:700 16px/1.2 var(--font-display)}
.pick span{color:var(--muted);font-size:13px}
.pick div{min-width:0}

/* browse */
.browse{margin-top:30px}
.browse-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.browse-head h2{margin:0;font:800 24px/1.1 var(--font-display);letter-spacing:-.01em}
.count{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-weight:500;color:var(--muted)
}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:16px}
.card{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.card-link{position:absolute;inset:0;z-index:2;border-radius:16px}
.card .art{aspect-ratio:4/3}
.card-info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card-info h3{margin:0;font:700 16px/1.2 var(--font-display)}
.card-info span{color:var(--muted);font-size:13px}
.playtag{
  position:absolute;left:50%;top:38%;translate:-50% -50%;z-index:1;width:52px;height:52px;border-radius:50%;
  background:var(--accent);display:grid;place-items:center;opacity:0;scale:.8;transition:opacity .18s,scale .18s
}
.playtag svg{width:22px;height:22px;margin-left:3px}
.card:hover .playtag,.card:focus-within .playtag{opacity:1;scale:1}
.fav{
  position:absolute;right:8px;top:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(10,12,28,.6);display:grid;place-items:center;color:#fff
}
.fav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.fav.on{color:var(--hot)}
.fav.on svg{fill:currentColor}
.empty{grid-column:1/-1;padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px}

/* art */
.art{background:linear-gradient(140deg,var(--c1),var(--c2));display:block;overflow:hidden;position:relative}
.art svg{width:100%;height:100%;display:block}

footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* player */
.player{
  position:fixed;inset:0;z-index:50;background:rgba(5,6,16,.86);display:flex;align-items:center;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))
}
.panel{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--surface);border-radius:20px;display:flex;flex-direction:column;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font:800 20px/1.1 var(--font-display);flex:1 1 140px;min-width:0}
.stats{display:flex;gap:16px;font:700 14px/1 var(--font-display)}
.stats span{color:var(--muted);font-weight:500;margin-right:6px}
.tools{display:flex;gap:8px}
.stage{background:var(--stage);padding:18px 14px;display:flex;justify-content:center;min-height:300px}
.panel-foot{padding:12px 16px 16px;color:var(--muted);font-size:14px}
.panel-foot strong{color:var(--fg)}

/* games */
.cv{display:block;max-width:100%;height:auto;border-radius:12px;background:var(--stage);border:1px solid var(--line);touch-action:none}
.box{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.ov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;background:rgba(10,12,28,.84);border-radius:12px;padding:16px;z-index:3}
.ov b{font:800 24px/1.1 var(--font-display)}
.ov p{margin:0;color:var(--muted)}
.t48{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px;background:var(--surface-2);border-radius:12px;width:min(100%,380px);aspect-ratio:1;touch-action:none}
.t48c{display:grid;place-items:center;border-radius:8px;background:#2a2f5a;font:800 clamp(18px,6vw,30px) var(--font-display);color:#fff;min-width:0}
.t48c[data-v="0"]{color:transparent}
.t48c[data-v="2"]{background:#e9ebff;color:#1b1f3e}
.t48c[data-v="4"]{background:#cfd3ff;color:#1b1f3e}
.t48c[data-v="8"]{background:#ffb35c;color:#261400}
.t48c[data-v="16"]{background:#ff9140;color:#261400}
.t48c[data-v="32"]{background:#ff6a4a;color:#fff}
.t48c[data-v="64"]{background:#ff3f5a;color:#fff}
.t48c[data-v="128"]{background:#b979ff;color:#fff}
.t48c[data-v="256"]{background:#9a62ff;color:#fff}
.t48c[data-v="512"]{background:#7b61ff;color:#fff}
.t48c[data-v="1024"]{background:#4fa3ff;color:#06182e;font-size:clamp(16px,5vw,26px)}
.t48c[data-v="2048"]{background:var(--gold);color:#2b1d00;font-size:clamp(16px,5vw,26px)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(100%,380px)}
.mc{aspect-ratio:1;border:0;border-radius:12px;background:var(--surface-2);color:transparent;font:700 clamp(24px,8vw,38px) var(--font-display);cursor:pointer;min-width:0}
.mc:hover{background:#2a3068}
.mc.up,.mc.done{color:var(--g);background:#262b57}
.mc.done{opacity:.5}
.ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,300px)}
.tc{aspect-ratio:1;border:0;border-radius:12px;background:var(--surface-2);font:800 clamp(34px,12vw,52px) var(--font-display);cursor:pointer;color:var(--fg)}
.tc:hover:not(:disabled){background:#2a3068}
.tc[data-m="X"]{color:var(--accent)}
.tc[data-m="O"]{color:var(--gold)}
.tc.win{background:#2b3a6e}
.seg{display:flex;gap:6px}
.status{min-height:24px;font:700 16px/1.4 var(--font-display)}
.mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(100%,360px);position:relative}
.hole{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,#05060f 40%,#241b3d 41%);position:relative;overflow:hidden;cursor:pointer;padding:0}
.hole .m{
  position:absolute;left:18%;right:18%;bottom:-6%;top:30%;border-radius:50% 50% 30% 30%;
  background:radial-gradient(circle at 35% 35%,#b98a62,#7a5233);translate:0 105%;transition:translate .09s ease-out
}
.hole .m::before,.hole .m::after{content:"";position:absolute;top:30%;width:12%;aspect-ratio:1;border-radius:50%;background:#14091f}
.hole .m::before{left:28%}.hole .m::after{right:28%}
.hole.up .m{translate:0 0}

@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .picks{flex-direction:row;flex-wrap:wrap}
  .picks h2{flex-basis:100%}
  .pick{flex:1 1 220px}
  .brand{font-size:20px}
  .search{order:3;flex-basis:100%;max-width:none;margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#" aria-label="Playhaus home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#7b61ff"/><rect x="7" y="7" width="8" height="8" rx="2" fill="#fff"/><rect x="17" y="7" width="8" height="8" rx="2" fill="#ffc83d"/><rect x="7" y="17" width="8" height="8" rx="2" fill="#ff5c8a"/><rect x="17" y="17" width="8" height="8" rx="2" fill="#3ddc97"/></svg>
      Playhaus
    </a>
    <div class="search">
      <label class="sr" for="q">Search games</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search games" autocomplete="off">
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero" aria-label="Featured">
    <article class="feature" id="feature"></article>
    <aside class="picks" id="picks"></aside>
  </section>

  <section class="browse" aria-labelledby="browse-title">
    <div class="browse-head">
      <h2 id="browse-title">All games</h2>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <span>Every game runs in your browser. Best scores and favorites stay on this device.</span>
    <span>Playhaus · Six games to start</span>
  </footer>
</main>

<div class="player" id="player" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" id="panel">
    <div class="panel-head">
      <h2 id="p-title"></h2>
      <div class="stats"><div><span>Score</span><b id="p-score">0</b></div><div><span>Best</span><b id="p-best">–</b></div></div>
      <div class="tools">
        <button class="btn ghost small" id="p-restart" type="button">Restart</button>
        <button class="btn ghost small" id="p-full" type="button">Fullscreen</button>
        <button class="btn small" id="p-close" type="button">Close</button>
      </div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="panel-foot" id="p-how"></div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ---------- storage ---------- */
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var bests=store.get('ph-best',{});
var favs=store.get('ph-fav',[]);

/* ---------- games ---------- */
var GAMES=[
{id:'snake',title:'Neon Snake',tags:['Arcade'],c1:'#14b88a',c2:'#0a5560',lower:false,
 desc:'Steer, eat, grow. Hit a wall or your own tail and the run is over.',
 how:'<strong>Controls:</strong> arrow keys or WASD to steer. On a touch screen, swipe on the board. Space or a tap restarts after a crash.',
 art:'<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="#d9fff1"><rect x="30" y="70" width="14" height="14" rx="3" opacity=".5"/><rect x="44" y="70" width="14" height="14" rx="3" opacity=".6"/><rect x="58" y="70" width="14" height="14" rx="3" opacity=".7"/><rect x="72" y="70" width="14" height="14" rx="3" opacity=".8"/><rect x="72" y="56" width="14" height="14" rx="3" opacity=".9"/><rect x="72" y="42" width="14" height="14" rx="3"/><rect x="86" y="42" width="14" height="14" rx="3"/></g><circle cx="122" cy="49" r="7" fill="#ff5c8a"/></svg>',
 mount:snake},
{id:'memory',title:'Pair Up',tags:['Puzzle','Casual'],c1:'#ff7a59',c2:'#c2336b',lower:true,
 desc:'Flip two cards at a time and find all eight matching pairs in the fewest moves.',
 how:'<strong>Goal:</strong> match all eight pairs. Your score is the number of moves, so lower is better.',
 art:'<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g><rect x="28" y="22" width="48" height="36" rx="8" fill="#fff" opacity=".92"/><rect x="84" y="22" width="48" height="36" rx="8" fill="#ffffff" opacity=".25"/><rect x="28" y="64" width="48" height="36" rx="8" fill="#ffffff" opacity=".25"/><rect x="84" y="64" width="48" height="36" rx="8" fill="#fff" opacity=".92"/></g><path d="M52 31l9 16H43z" fill="#c2336b"/><circle cx="108" cy="82" r="9" fill="#ff7a59"/></svg>',
 mount:memory},
{id:'tiles',title:'Tile Merge',tags:['Puzzle'],c1:'#ffb347',c2:'#e0562f',lower:false,
 desc:'Slide the board, join equal numbers and chase the 2048 tile.',
 how:'<strong>Controls:</strong> arrow keys, or swipe on the board. Equal tiles that collide merge into one.',
 art:'<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g font-family="Rubik,sans-serif" font-weight="800" font-size="22" text-anchor="middle"><rect x="30" y="20" width="46" height="38" rx="8" fill="#fff3d6"/><text x="53" y="47" fill="#5a3200">2</text><rect x="84" y="20" width="46" height="38" rx="8" fill="#ffd27a"/><text x="107" y="47" fill="#5a3200">8</text><rect x="30" y="64" width="46" height="38" rx="8" fill="#ff8f4d"/><text x="53" y="91" fill="#fff">32</text><rect x="84" y="64" width="46" height="38" rx="8" fill="#7b2d1b"/><text x="107" y="91" fill="#fff">64</text></g></svg>',
 mount:tiles},
{id:'pong',title:'Paddle Duel',tags:['Arcade'],c1:'#4f7cff',c2:'#2a2a8f',lower:false,
 desc:'Classic paddle tennis against the computer. First to five points takes the match.',
 how:'<strong>Controls:</strong> move the mouse or drag a finger over the court, or use W/S or the up and down arrows. Your score is how many returns you make in a match.',
 art:'<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="#fff"><rect x="22" y="38" width="7" height="34" rx="3"/><rect x="131" y="52" width="7" height="34" rx="3"/><circle cx="92" cy="58" r="6" fill="#ffc83d"/></g><path d="M80 12v96" stroke="#fff" stroke-opacity=".3" stroke-width="3" stroke-dasharray="7 8"/></svg>',
 mount:pong},
{id:'tictactoe',title:'Three in a Row',tags:['Casual','Two player'],c1:'#a45cff',c2:'#4b2aa8',lower:false,
 desc:'Noughts and crosses. Beat the computer to build a streak, or pass the screen to a friend.',
 how:'<strong>Goal:</strong> line up three marks. Against the computer your score is your win streak. Two players share one screen.',
 art:'<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g stroke="#fff" stroke-opacity=".45" stroke-width="4" stroke-linecap="round"><path d="M64 20v80M96 20v80M38 46h84M38 74h84"/></g><g stroke="#ffc83d" stroke-width="6" stroke-linecap="round"><path d="M44 26l14 14M58 26L44 40"/></g><circle cx="80" cy="60" r="9" fill="none" stroke="#fff" stroke-width="6"/><g stroke="#ffc83d" stroke-width="6" stroke-linecap="round"><path d="M102 80l14 14M116 80l-14 14"/></g></svg>',
 mount:ttt},
{id:'moles',title:'Mole Patrol',tags:['Arcade','Casual'],c1:'#3fbf6e',c2:'#1e6b49',lower:false,
 desc:'Thirty seconds, nine holes, one very quick mole. Tap it every time it pops up.',
 how:'<strong>Goal:</strong> tap or click each mole as it appears. It gets faster the more you hit. You have 30 seconds.',
 art:'<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="#0b2a1e"><ellipse cx="40" cy="92" rx="22" ry="9"/><ellipse cx="80" cy="92" rx="22" ry="9"/><ellipse cx="120" cy="92" rx="22" ry="9"/></g><path d="M62 92c0-20 8-30 18-30s18 10 18 30z" fill="#b98a62"/><circle cx="73" cy="78" r="2.6" fill="#1b0f22"/><circle cx="87" cy="78" r="2.6" fill="#1b0f22"/><ellipse cx="80" cy="85" rx="4" ry="3" fill="#ff8aa0"/></svg>',
 mount:moles}
];
var byId={};GAMES.forEach(function(g){byId[g.id]=g});

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t}return a}
var HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.3C.8 8.1 3 4.5 6.6 4.5c2 0 3.5 1 4.4 2.4h2c.9-1.400 2.400-2.400 4.400-2.400 3.600 0 5.800 3.600 4.200 7.200C19.500 16.400 12 21 12 21z"/></svg>';
var PLAY='<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>';
function art(g){return '<div class="art" style="--c1:'+g.c1+';--c2:'+g.c2+'">'+g.art+'</div>'}
function isFav(id){return favs.indexOf(id)>-1}

/* ---------- home ---------- */
var state={cat:'All',q:''};
var CATS=['All','Arcade','Puzzle','Casual','Two player','Favorites'];

function renderHero(){
  var day=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/864e5);
  var i=day%GAMES.length,g=GAMES[i];
  $('feature').innerHTML=art(g)+
    '<div class="feature-body"><div><div class="eyebrow">Game of the day</div><h1>'+g.title+'</h1><p>'+g.desc+'</p></div>'+
    '<a class="btn" href="#play-'+g.id+'">'+PLAY.replace('#fff','#fff')+' Play now</a></div>';
  var picks='<h2>Quick picks</h2>';

/* ---------- game: Neon Snake ---------- */
function snake(host,api){
  var N=20,S=20,W=N*S;
  var cv=el('canvas','cv');cv.width=cv.height=W;cv.setAttribute('aria-label','Snake board');host.appendChild(cv);
  var ctx=cv.getContext('2d');
  var body,dir,qdir,food,alive,timer,score;
  function spawn(){var p;do{p={x:Math.random()*N|0,y:Math.random()*N|0}}while(body.some(function(s){return s.x===p.x&&s.y===p.y}));food=p}
  function reset(){
    body=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=qdir={x:1,y:0};score=0;alive=true;
    api.score(0);spawn();clearInterval(timer);timer=setInterval(tick,105);draw();
  }
  function tick(){
    dir=qdir;
    var h={x:body[0].x+dir.x,y:body[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(function(s){return s.x===h.x&&s.y===h.y})){
      alive=false;clearInterval(timer);api.end(score);draw();return;
    }
    body.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;api.score(score);spawn()}else body.pop();
    draw();
  }
  function draw(){
    ctx.fillStyle='#0a0c1c';ctx.fillRect(0,0,W,W);
    ctx.fillStyle='#161a33';
    for(var x=0;x<N;x++)for(var y=0;y<N;y++)ctx.fillRect(x*S+9,y*S+9,2,2);
    ctx.fillStyle='#ff5c8a';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2-3,0,7);ctx.fill();
    body.forEach(function(s,i){ctx.fillStyle=i===0?'#8bffd6':'#14b88a';ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});
    if(!alive){
      ctx.fillStyle='rgba(10,12,28,.8)';ctx.fillRect(0,0,W,W);
      ctx.fillStyle='#fff';ctx.textAlign='center';
      ctx.font='800 30px Rubik,sans-serif';ctx.fillText('Game over',W/2,W/2-8);
      ctx.fillStyle='#9ba1c9';ctx.font='500 16px DM Sans,sans-serif';
      ctx.fillText('Score '+score+'  ·  Tap or press Space to retry',W/2,W/2+22);
    }
  }
  function turn(x,y){if(x===-dir.x&&y===-dir.y)return;qdir={x:x,y:y}}
  function key(e){
    var k=e.key,m={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
    if(m[k]){e.preventDefault();turn(m[k][0],m[k][1]);return}
    if((k===' '||k==='Enter')&&!alive){e.preventDefault();reset()}
  }
  var sx=0,sy=0;
  function ts(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY}
  function te(e){
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<14&&Math.abs(dy)<14){if(!alive)reset();return}
    if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
  }
  function tm(e){e.preventDefault()}
  function click(){if(!alive)reset()}
  window.addEventListener('keydown',key);
  cv.addEventListener('touchstart',ts,{passive:true});
  cv.addEventListener('touchend',te);
  cv.addEventListener('touchmove',tm,{passive:false});
  cv.addEventListener('click',click);
  reset();
  return function(){clearInterval(timer);window.removeEventListener('keydown',key)};
}

/* ---------- game: Tile Merge ---------- */
function tiles(host,api){
  var wrap=el('div','t48');host.appendChild(wrap);
  var cells=[];
  for(var i=0;i<16;i++){var c=el('div','t48c');wrap.appendChild(c);cells.push(c)}
  var ov=el('div','ov');ov.hidden=true;wrap.appendChild(ov);
  var b,score;
  function add(){
    var e=[];b.forEach(function(v,i){if(!v)e.push(i)});
    if(!e.length)return;
    b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4;
  }
  function render(){cells.forEach(function(c,i){var v=b[i];c.textContent=v||'';c.setAttribute('data-v',v||0)})}
  function slide(line){
    var a=line.filter(Boolean),g=0;
    for(var i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;g+=a[i];a.splice(i+1,1)}}
    while(a.length<4)a.push(0);
    return [a,g];
  }
  function stuck(){
    for(var i=0;i<16;i++){
      if(!b[i])return false;
      if(i%4<3&&b[i]===b[i+1])return false;
      if(i<12&&b[i]===b[i+4])return false;
    }
    return true;
  }
  function reset(){
    b=new Array(16).fill(0);score=0;add();add();render();api.score(0);ov.hidden=true;
  }
  function move(d){
    if(!ov.hidden)return;
    var moved=false,gain=0,nb=b.slice();
    for(var k=0;k<4;k++){
      var idx=[0,1,2,3].map(function(j){return d===0?k*4+j:d===2?k*4+3-j:d===1?j*4+k:(3-j)*4+k});
      var r=slide(idx.map(function(i){return b[i]}));
      gain+=r[1];
      idx.forEach(function(i,j){if(nb[i]!==r[0][j])moved=true;nb[i]=r[0][j]});
    }
    if(!moved)return;
    b=nb;score+=gain;add();render();api.score(score);
    if(stuck()){
      api.end(score);
      ov.innerHTML='<b>No moves left</b><p>Score '+score+'</p>';
      var btn=el('button','btn','Try again');btn.type='button';btn.addEventListener('click',reset);
      ov.appendChild(btn);ov.hidden=false;
    }
  }
  function key(e){
    var m={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3,a:0,w:1,d:2,s:3};
    if(m[e.key]!==undefined){e.preventDefault();move(m[e.key])}
  }
  var sx=0,sy=0;
  function ts(e){var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY}
  function te(e){
    var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?2:0);else move(dy>0?3:1);
  }
  window.addEventListener('keydown',key);
  wrap.addEventListener('touchstart',ts,{passive:true});
  wrap.addEventListener('touchend',te);
  reset();
  return function(){window.removeEventListener('keydown',key)};
}

/* ---------- game: Paddle Duel ---------- */
function pong(host,api){
  var W=600,H=400,PH=80,PW=10,WIN=5;
  var cv=el('canvas','cv');cv.width=W;cv.height=H;cv.setAttribute('aria-label','Pong court');host.appendChild(cv);
  var ctx=cv.getContext('2d');
  var py,ay,ball,ps,as,hits,mode,keys={},raf,last=0;
  function fresh(){py=ay=H/2-PH/2;ps=as=0;hits=0;api.score(0)}
  function serve(d){ball={x:W/2,y:H/2,vx:270*d,vy:(Math.random()*2-1)*170}}
  function start(){if(mode==='over'||mode==='ready'){if(mode==='over')fresh();serve(Math.random()<.5?1:-1);mode='play'}}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function bounce(side,paddleY){
    var off=(ball.y-(paddleY+PH/2))/(PH/2);
    var sp=Math.min(Math.hypot(ball.vx,ball.vy)*1.06,640),ang=off*.9;
    ball.vx=Math.cos(ang)*sp*(side==='L'?1:-1);ball.vy=Math.sin(ang)*sp;
  }
  function update(dt){
    if(keys.up)py-=380*dt;if(keys.down)py+=380*dt;py=clamp(py,0,H-PH);
    var target=ball.vx>0?ball.y-PH/2:H/2-PH/2,s=250*dt;
    ay+=clamp(target-ay,-s,s);ay=clamp(ay,0,H-PH);
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.y<6){ball.y=6;ball.vy=Math.abs(ball.vy)}
    if(ball.y>H-6){ball.y=H-6;ball.vy=-Math.abs(ball.vy)}
    if(ball.vx<0&&ball.x-6<20+PW&&ball.x>14&&Math.abs(ball.y-(py+PH/2))<PH/2+6){
      ball.x=20+PW+6;bounce('L',py);hits++;api.score(hits);
    }
    if(ball.vx>0&&ball.x+6>W-20-PW&&ball.x<W-14&&Math.abs(ball.y-(ay+PH/2))<PH/2+6){
      ball.x=W-20-PW-6;bounce('R',ay);
    }
    if(ball.x<-10){as++;point(1)}
    else if(ball.x>W+10){ps++;point(-1)}
  }
  function point(d){
    if(ps>=WIN||as>=WIN){mode='over';api.end(hits)}else serve(d);
  }
  function draw(){
    ctx.fillStyle='#0a0c1c';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#2d3360';ctx.lineWidth=3;ctx.setLineDash([10,12]);
    ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#eef0fb';ctx.fillRect(20,py,PW,PH);ctx.fillRect(W-20-PW,ay,PW,PH);
    ctx.fillStyle='#ffc83d';ctx.beginPath();ctx.arc(ball.x,ball.y,6,0,7);ctx.fill();
    ctx.fillStyle='#9ba1c9';ctx.font='800 40px Rubik,sans-serif';ctx.textAlign='center';
    ctx.fillText(ps,W/2-60,52);ctx.fillText(as,W/2+60,52);
    if(mode!=='play'){
      ctx.fillStyle='rgba(10,12,28,.78)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff';ctx.font='800 30px Rubik,sans-serif';
      ctx.fillText(mode==='ready'?'Ready?':(ps>as?'You win':'Computer wins'),W/2,H/2-6);
      ctx.fillStyle='#9ba1c9';ctx.font='500 16px DM Sans,sans-serif';
      ctx.fillText(mode==='ready'?'Click or tap to serve':'Returns: '+hits+'  ·  Click to play again',W/2,H/2+24);
    }
  }
  function loop(t){
    var dt=Math.min(.033,(t-last)/1000||0);last=t;
    if(mode==='play')update(dt);
    draw();raf=requestAnimationFrame(loop);
  }
  function setY(clientY){
    var r=cv.getBoundingClientRect();
    py=clamp((clientY-r.top)*(H/r.height)-PH/2,0,H-PH);
  }
  function mm(e){setY(e.clientY)}
  function tm(e){e.preventDefault();setY(e.touches[0].clientY)}
  function kd(e){
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){keys.up=true;e.preventDefault()}
    if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){keys.down=true;e.preventDefault()}
    if((e.key===' '||e.key==='Enter')&&mode!=='play'){e.preventDefault();start()}
  }
  function ku(e){
    if(e.key==='ArrowUp'||e.key==='w'||e.key==='W')keys.up=false;
    if(e.key==='ArrowDown'||e.key==='s'||e.key==='S')keys.down=false;
  }
  fresh();serve(1);mode='ready';
  cv.addEventListener('mousemove',mm);
  cv.addEventListener('touchmove',tm,{passive:false});
  cv.addEventListener('touchstart',function(e){setY(e.touches[0].clientY)},{passive:true});
  cv.addEventListener('click',start);
  window.addEventListener('keydown',kd);window.addEventListener('keyup',ku);
  raf=requestAnimationFrame(loop);
  return function(){cancelAnimationFrame(raf);window.removeEventListener('keydown',kd);window.removeEventListener('keyup',ku)};
}

/* ---------- game: Three in a Row ---------- */
function ttt(host,api){
  var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var box=el('div','box');
  var seg=el('div','seg');
  var bCpu=el('button','chip','Vs computer'),b2p=el('button','chip','Two players');
  bCpu.type=b2p.type='button';seg.appendChild(bCpu);seg.appendChild(b2p);
  var status=el('div','status');
  var board=el('div','ttt-board');
  var again=el('button','btn small','Next round');again.type='button';again.hidden=true;
  box.appendChild(seg);box.appendChild(status);box.appendChild(board);box.appendChild(again);host.appendChild(box);
  var b,turn,over,mode='cpu',streak=0,timers=[],cells=[];
  for(var i=0;i<9;i++)(function(i){
    var c=el('button','tc');c.type='button';c.setAttribute('aria-label','Square '+(i+1));
    c.addEventListener('click',function(){
      if(over||b[i])return;
      if(mode==='cpu'&&turn!=='X')return;
      play(i);
    });
    board.appendChild(c);cells.push(c);
  })(i);
  function result(bd){
    for(var k=0;k<LINES.length;k++){var l=LINES[k];if(bd[l[0]]&&bd[l[0]]===bd[l[1]]&&bd[l[1]]===bd[l[2]])return {w:bd[l[0]],l:l}}
    return bd.every(Boolean)?{w:'draw'}:null;
  }
  function render(){
    cells.forEach(function(c,i){c.textContent=b[i];c.setAttribute('data-m',b[i]);c.disabled=!!b[i]||over;c.classList.remove('win')});
  }
  function reset(){
    timers.forEach(clearTimeout);timers=[];
    b=new Array(9).fill('');turn='X';over=false;again.hidden=true;render();say();
  }
  function say(){
    if(mode==='cpu')status.textContent=turn==='X'?'Your move (X)':'Computer is thinking…';
    else status.textContent=turn+' to move';
  }
  function play(i){
    b[i]=turn;render();
    var r=result(b);
    if(r){finish(r);return}
    turn=turn==='X'?'O':'X';say();
    if(mode==='cpu'&&turn==='O')timers.push(setTimeout(cpu,380));
  }
  function minimax(bd,isO){
    var r=result(bd);
    if(r)return r.w==='O'?1:r.w==='X'?-1:0;
    var best=isO?-2:2;
    for(var i=0;i<9;i++)if(!bd[i]){
      bd[i]=isO?'O':'X';var s=minimax(bd,!isO);bd[i]='';
      if(isO?s>best:s<best)best=s;
    }
    return best;
  }
  function cpu(){
    if(over)return;
    var empty=[];for(var i=0;i<9;i++)if(!b[i])empty.push(i);
    var pick;
    if(Math.random()<.22)pick=empty[Math.random()*empty.length|0];
    else{
      var bs=-2,opts=[];
      empty.forEach(function(i){b[i]='O';var s=minimax(b,false);b[i]='';if(s>bs){bs=s;opts=[i]}else if(s===bs)opts.push(i)});
      pick=opts[Math.random()*opts.length|0];
    }
    play(pick);
  }
  function finish(r){
    over=true;render();
    if(r.l)r.l.forEach(function(i){cells[i].classList.add('win')});
    if(r.w==='draw')status.textContent='Draw.';
    else if(mode==='cpu')status.textContent=r.w==='X'?'You win!':'Computer wins.';
    else status.textContent=r.w+' wins!';
    if(mode==='cpu'){
      if(r.w==='X'){streak++;api.score(streak);api.end(streak)}else{streak=0;api.score(0)}
    }
    again.hidden=false;
  }
  function setMode(m){
    mode=m;streak=0;api.score(0);
    bCpu.setAttribute('aria-pressed',m==='cpu');b2p.setAttribute('aria-pressed',m==='2p');
    reset();
  }
  bCpu.addEventListener('click',function(){setMode('cpu')});
  b2p.addEventListener('click',function(){setMode('2p')});
  again.addEventListener('click',reset);
  setMode('cpu');
  return function(){timers.forEach(clearTimeout)};
}

function moles(host,api){
  var box=el('div','box');
  var clock=el('div','status','Time left: 30s');
  var grid=el('div','mole-grid');
  box.appendChild(clock);box.appendChild(grid);host.appendChild(box);
  var holes=[],up=-1,score=0,left=30,running=false,moleT=null,tickT=null,nextT=null;
  for(var i=0;i<9;i++)(function(i){
    var h=el('button','hole','<span class="m"></span>');h.type='button';h.setAttribute('aria-label','Hole '+(i+1));
    h.addEventListener('pointerdown',function(e){e.preventDefault();hit(i)});
    h.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(i)}});
    grid.appendChild(h);holes.push(h);
  })(i);
  var ov=el('div','ov');grid.appendChild(ov);
  function intro(title,sub){
    ov.innerHTML='<b>'+title+'</b><p>'+sub+'</p>';
    var btn=el('button','btn',score||title==='Time up!'?'Play again':'Start');btn.type='button';
    btn.addEventListener('click',start);ov.appendChild(btn);ov.hidden=false;
  }
  function hideMole(){if(up>-1)holes[up].classList.remove('up');up=-1}
  function pop(){
    if(!running)return;
    var i;do{i=Math.random()*9|0}while(i===up);
    hideMole();up=i;holes[i].classList.add('up');
    var dur=Math.max(430,880-score*14);
    moleT=setTimeout(function(){hideMole();nextT=setTimeout(pop,150)},dur);
  }
  function hit(i){
    if(!running||i!==up)return;
    score++;api.score(score);hideMole();
    clearTimeout(moleT);nextT=setTimeout(pop,120);
  }
  function start(){
    score=0;left=30;running=true;api.score(0);ov.hidden=true;clock.textContent='Time left: 30s';
    clearInterval(tickT);
    tickT=setInterval(function(){
      left--;clock.textContent='Time left: '+left+'s';
      if(left<=0)finish();
    },1000);
    pop();
  }
  function finish(){
    running=false;clearInterval(tickT);clearTimeout(moleT);clearTimeout(nextT);hideMole();
    api.end(score);intro('Time up!',score+(score===1?' mole':' moles')+' whacked');
  }
  intro('Mole Patrol','Tap each mole before it ducks away.');
  return function(){clearInterval(tickT);clearTimeout(moleT);clearTimeout(nextT)};
}

/* ---------- boot ---------- */
renderHero();renderChips();renderGrid();route();
})();
</script>
